services:
  database:
    image: postgres:16-alpine
    container_name: investsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investsmart}
      POSTGRES_USER: ${POSTGRES_USER:-investsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no .env raiz}
    ports:
      - "5433:5432"
    volumes:
      - investsmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investsmart-postgres-data:
